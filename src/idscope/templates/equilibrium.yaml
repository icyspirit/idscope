# idscope template: profiles of the equilibrium IDS.
#
#   idscope -T equilibrium SOURCE [SOURCE ...]
#
# Profiles are drawn against rho_tor_norm or, when it is not filled, against the
# normalized poloidal flux: psi_norm, or psi normalized from the magnetic axis to
# the boundary with norm(). Paths separated by "|" are alternatives, tried in order;
# they also cover names that differ between Data Dictionary 3 and 4.
title: equilibrium
columns:
  - panels:
      - title: Safety factor
        signals:
          - path: equilibrium/time_slice/profiles_1d/q
            x: &x equilibrium/time_slice/profiles_1d/rho_tor_norm | equilibrium/time_slice/profiles_1d/psi_norm | norm(equilibrium/time_slice/profiles_1d/psi)
            label: q
        y_label: q
      - title: Pressure
        signals:
          - path: equilibrium/time_slice/profiles_1d/pressure
            x: *x
            label: p
            scale: 1.0e-3
        y_label: p [kPa]
      - title: Current density
        signals:
          - path: equilibrium/time_slice/profiles_1d/j_phi | equilibrium/time_slice/profiles_1d/j_tor
            x: *x
            label: j_phi
            scale: 1.0e-6
          - path: equilibrium/time_slice/profiles_1d/j_parallel
            x: *x
            label: j_parallel
            scale: 1.0e-6
        y_label: j [MA m^-2]
  - panels:
      - title: Pressure gradient
        signals:
          - path: equilibrium/time_slice/profiles_1d/dpressure_dpsi
            x: *x
            label: dp/dpsi
            scale: 1.0e-3
        y_label: dp/dpsi [kPa Wb^-1]
      - title: FF'
        signals:
          - path: equilibrium/time_slice/profiles_1d/f_df_dpsi
            x: *x
            label: FF'
        y_label: FF' [T^2 m^2 Wb^-1]
      - title: Shape
        signals:
          - path: equilibrium/time_slice/profiles_1d/elongation
            x: *x
            label: elongation
          - path: equilibrium/time_slice/profiles_1d/triangularity_upper
            x: *x
            label: triangularity (upper)
          - path: equilibrium/time_slice/profiles_1d/triangularity_lower
            x: *x
            label: triangularity (lower)
        y_label: kappa, delta
