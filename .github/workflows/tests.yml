# Lint and test idscope with both kinds of Qt binding, without a display.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }}, ${{ matrix.qt }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # imas-core, which imas-python needs, has wheels from Python 3.10 on
          - python: "3.10"
            qt: PyQt5
          - python: "3.12"
            qt: PySide6
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Libraries that Qt loads
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" ${{ matrix.qt }} pyflakes
      - name: pyflakes
        run: python -m pyflakes src tests
      - name: pytest
        run: python -m pytest -q
